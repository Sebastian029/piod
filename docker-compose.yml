services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-piod}
      POSTGRES_USER: ${POSTGRES_USER:-piod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-piod}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: DjangoProject/Dockerfile
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-piod}
      DB_USER: ${POSTGRES_USER:-piod}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-piod}
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: "*"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changemejwt}
      DEBUG: "True"
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # <-- DODAJ TO! Mapuje cały projekt do /app w kontenerze
      - static-data:/app/DjangoProject/staticfiles

volumes:
  db-data:
  static-data:

